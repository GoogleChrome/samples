<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>automatic-speech-recognition</title>
    <style>
      /* Your styles here */
    </style>
  </head>
  
  <body>
    <audio controls src="jfk.wav"></audio>
    <pre></pre>
    <script type=module>
      import { pipeline } from "https://unpkg.com/@huggingface/transformers@4.2.0/dist/transformers.min.js"

      const asr = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {device: 'webgpu'});
      const result = await asr('jfk.wav');
      document.querySelector('pre').textContent = JSON.stringify(result, null, 2);
    </script>    
  </body>
</html>
