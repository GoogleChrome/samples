				color: #333;
			}
			h1 {
				color: #111;
			}
			#demo-list {

				border-radius: 8px;

				list-style: none;
				padding: 0;
			}
			li {
				padding: 0.75em 1em;

				display: flex;

			}
			li:last-child {

				color: #0366d6;
				font-weight: 600;
			}
			a:hover {
				text-decoration: underline;
			}
			.description {
				font-size: 0.9em;
				color: #586069;
				margin: 0.2em 0 0;
				font-weight: 400;
			}
			.source-link {
				font-size: 0.9em;
				font-weight: 400;
				color: #586069;
				white-space: nowrap;
				margin-left: 1em;
			}
			.loading, .error {
				color: #586069;
				font-style: italic;
			}
			a[href*="cloudfunctions.net"]::after {
				content: '';
				display: inline-block;
				width: 1.5em;
				height: 1.5em;
				margin-left: 0.3em;
				vertical-align: middle;
				background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path d='m0 0H512V512H0' fill='%23fff'/><path fill='%23539E43' d='M247 281q3 0 4 2c2 3-2 27 34 30s57-2 60-18-4-21-60-27-56-33-56-42 0-49 68-49 70 40 71 47 0 9-4 9H346q-4 0-5-5c-3-12-9-25-44-25s-39 11-39 22 11 13 47 18 65 9 69 39-16 58-71 58q-79 0-79-54 0-5 5-5M417 145q16 9 16 29V340q0 18-14 27L273 452q-16 8-32 0l-49-29q-8-4-2-6 13-4 22-10 2-1 4 0l37 22q3 2 6 0l145-84q2-1 2-5V172q0-3-2-4L259 84q-3-2-6 0L107 168q-2 1-2 4V341q0 3 2 4l40 23c16 9 35 3 35-15V188q0-6 6-6h16q6 0 6 6V353c0 49-45 55-77 37L94 368q-15-9-15-27V172q0-18 16-27L237 63q19-12 38 0'/></svg>");
				background-size: contain;
				background-repeat: no-repeat;
				background-position: center;

		</style>
	</head>
	<body>
		<h1>PWA Testing Demos 🧪</h1>
		<p>This page dynamically lists all demos from 
      	    <a href="https://github.com/GoogleChrome/samples/tree/gh-pages/pwa-testing">github.com/GoogleChrome/samples/pwa-testing</a>.
		</p>
		<div id="demo-list">
			<p class="loading">Loading demos from GitHub API...</p>
		</div>
		<script>
			const GITHUB_API_URL = 'https://api.github.com/repos/GoogleChrome/samples/contents/pwa-testing?ref=gh-pages';
			const DEMO_BASE_URL = 'https://googlechrome.github.io/samples/pwa-testing/';

			const metadata = {

				"curious-sun-catboat": "URL params in scope and start_url (allowed by code @ 2024-05 but not allowed by spec)",

				"delirious-twilight-scene": "Has a distinct name and short_name",

				"fake-chat-app-companion": "companion app to above",

				"fir-skirt": "SVG icon",
				"flossy-neon-sugar": "tabbed mode with focus-existing",
				"flower-confused-dinosaur": "Test site with different images embedded for testing go/shortcuts-not-apps",
				"foggy-noiseless-cylinder": "Name is made entirely of emojis and longer than 45 characters",
				"furry-hickory-furniture": "Change manifest url, start_url, and scope dynamically",
				"gira-test-app": "Test app for getInstalledRelatedApps() API",

				"halved-cubic-postage": "Empty name and empty page title.",

				"hwr-playground": "Handwriting Recognition API testing",

				"invincible-syringa": "Uses minimal-ui display mode",

				"predictable-app-update": "Site to test manifest updates of both security and non-security sensitive fields.",

				"six-great-candytuft": "scope_extensions secondary site",

				"soft-puppy": "Updates the HTML theme color continuously",
				"solstice-few-vegetable": "Has a manifest that is a data url",
				"sprinkle-youthful-cylinder": "AccentColor test",
				"star-fire-agate": "Service worker fetch event does nothing",
				"sulfuric-awake-astronaut": "Companion to app above. Associate site allowing the app above to have an extended scope",
				"sulky-lopsided-bean": "launch_handler: { \"route_to\": \"existing-client\", \"navigate_existing_client\": \"never\" }",
				"sunny-cart": "For testing web share and web share target",
				"super-concrete-tarsal": "Sharing testing",
				"telling-krills": "Dynamically load HTTP content",
				"thundering-frigate": "Can switch between light and dark HTML theme colours",
				"treasure-chronometer": "Prevent defaults all input events and displays what it sees (keyboard lock)",
				"uncovered-hound": "Sets a before unload event to prevent tab closure",
				"unexpected-five-scowl": "Hash fragment in manifest ID, should be ignored in comparisons",
				"upbeat-hydrant": "Prefers a related Android app",
				"veil-superb-gondola": "Service worker replaces main page with plain text",
				"waiting-zigzag-windscreen": "No icon; non-BMP Unicode character in title (Chinese)",
				"watery-shingle": "Uses geolocation permission",
				"web-usb-api-test": "WebUSB API basic operations",
				"webappbundle": "See also https://us-central1-web-devrel-apps.cloudfunctions.net/webappbundle/test.wbn",
				"wind-veterinarian": "Multiple disjoint scopes on same origin",
				"wooded-crayfish": "Nested scopes",
				"yielding-large-chef": "Note-taking web app",
				"youtube-icons": "YouTube Icons and Notifications API testing"
				};
				
				const specialDemoFolders = [
				'broken-synonymous-air',
				'cache-api-perf',
				'fetch-event-echo',
				'invincible-syringa',
				'maze-bouncy-viola',
				'notch-candle-shape',
				'octagonal-eight-potato',
				'saber-tabby-shield',
				'sassy-seasoned-carpet',
				'webappbundle',
				];
				
				const NEW_DEMO_BASE_URL = 'https://us-central1-web-devrel-apps.cloudfunctions.net/';
				
				const listContainer = document.getElementById('demo-list');
				
				async function fetchAndDisplayDemos() {
					try {
						const response = await fetch(GITHUB_API_URL);
						
						if (!response.ok) {
							throw new Error(`GitHub API Error: ${response.status} ${response.statusText}`);
						}
						
						const items = await response.json();
						
						// We are only interested in directories, as each one is a demo.
						const demos = items.filter(item => item.type === 'dir');
						
						if (demos.length === 0) {
							listContainer.innerHTML = `<p class="error">No demos found in the specified directory.</p>`;
							return;
						}
						
						// Build the HTML list
						const listHtml = demos.map(demo => {
							
							let demoUrl;
							
							if (specialDemoFolders.includes(demo.name)) {
								// If it's a special folder, transform the name and use the new URL
								const transformedName = demo.name.replace(/-/g, '_');
								demoUrl = `${NEW_DEMO_BASE_URL}${transformedName}/`;
								} else {
									// Otherwise, use the default demo URL
									demoUrl = `${DEMO_BASE_URL}${demo.name}`;
								}
								
								const description = metadata[demo.name] || 'No description available.';
								const sourceUrl = `${SOURCE_BASE_URL}${demo.name}`;
								
								return `
								<li>
								<div>
								<a href="${demoUrl}" rel="noopener noreferrer">${demo.name}</a>
								<p class="description">${description}</p>
								</div>
								<a href="${sourceUrl}" rel="noopener noreferrer" class="source-link">View Source</a>
								</li>
								`;
								}).join('');
								
								listContainer.innerHTML = `<ul>${listHtml}</ul>`;
								
								} catch (error) {
									console.error('Failed to fetch demos:', error);
									listContainer.innerHTML = `<p class="error">Sorry, could not fetch the demo list. Please check the browser console for more details.</p>`;
								}
							}
							
							fetchAndDisplayDemos();
		</script>
	</body>
</html>
