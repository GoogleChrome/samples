<!DOCTYPE html>
<html>
<head>
  <title id="title"></title>
  <link rel="manifest" href="manifest.webmanifest">
  <link id="favicon" rel="icon" type="image/png" href="32x32-alt.png">
  <style>
    * {
      font-family: monospace;
    }
    img {
      border: 5px solid #555;
    }
  </style>
</head>  
<body>
<h1>
Test site to verify predictable app updating
</h1>
<img id="pageIcon" src="256x256.png"><br>
<p>
<label for="appName">Select name:</label>
<select id="appName">
  <option>FOOOOOOOO</option>
  <option>BARRRRRRR</option>
</select><br>
</p>
<p>
<label for="appIcon">Select icon (Change white -> alt icons to verify the 10% diff):</label>
<select id="appIcon">
  <option>white_icons</option>
  <option>red_icons</option>
  <option>alt_icons</option>
</select><br>
</p>
<p>
<label for="themeColorSelect">Select theme color (verify non-security sensitive update):</label>
<select id="themeColorSelect">
  <option>lightgreen</option>
  <option>lightsalmon</option>
  <option>gold</option>
  <option>lightskyblue</option>
  <option>white</option>
  <option>black</option>
</select><br>
</p>
<h2>
  Output manifest:
</h2>
<pre id="output"></pre>
<script src="main.js"></script>
</body>
</html>
