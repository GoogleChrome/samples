<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="manifest" href="./manifest.json">
		<title>Main PWA origin</title>
	</head>
	<body>
		<h1>Scope Extensions API demo</h1>
		<h2>Main PWA origin</h2>
		<ul>
			<li><a href="manifest.json">Web Manifest</a>
			containing "scope_extensions" member</li>
			<li>Origin in extended scope: <a href="https://googlechrome.github.io/samples/associated-pwa-origin">https://googlechrome.github.io/samples/associated-pwa-origin</a>
				with <a href="https://googlechrome.github.io/.well-known/web-app-origin-association">Web app origin association file</a></li>
			<li>Origin not in extended scope: <a href="https://www.example.com">https://www.example.com</a></li>
		</ul>
	</body>
</html>
