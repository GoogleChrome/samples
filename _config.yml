encoding: utf-8
gh_pages_url_prefix: https://googlechrome.github.io/samples
gh_url_prefix: https://github.com/googlechrome/samples/blob/gh-pages
plugins:
  - jekyll-sitemap
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
exclude:
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - node_modules
  - Gemfile
  - Gemfile.lock
  - .jekyll-metadata
  - .travis.yml
  - .eslintignore
  - .eslintrc
  - trailblazers/README.md
  - trailblazers/AGENTS.md
  - trailblazers/SKILL.md
  - trailblazers/content/
  - trailblazers/public/
  - trailblazers/_data/
  - trailblazers/_includes/
  - trailblazers/_config/
  - trailblazers/eleventy.config.js
  - trailblazers/package.json
  - trailblazers/package-lock.json
include:
  - .well-known
  - trailblazers/dist/
