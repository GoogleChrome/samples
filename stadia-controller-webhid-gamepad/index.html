    <h1>Stadia Controller with the WebHID API and the Gamepad API</h1>
    <p>
      Connect the controller once. Future connections will happen automatically.
    </p>
    <button type="button">🎮 Connect controller</button>
    <p>The <kbd>A</kbd>, <kbd>B</kbd>, <kbd>X</kbd>, and <kbd>Y</kbd> buttons are controlled by the <a href="https://developer.mozilla.org/en-US/docs/Web/API/Gamepad_API">Gamepad API</a>.</p>
    <p>The <kbd>Assistant</kbd> and the <kbd>Capture</kbd> buttons are controlled by the <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebHID_API">WebHID API</a>.</p>
