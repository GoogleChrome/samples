<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dark Mode Art Direction</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://googlechromelabs.github.io/dark-mode-toggle/src/dark-mode-toggle.mjs"></script>
    <style >  
      body {
        background-color: #000;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      a {
        color: red;
      }
      figure, img {
        display: block;
        max-width: 480px;
        width: 100%;
        height: auto;

      }
      figcaption {
        text-align: center;  
      }  
      dark-mode-toggle {
        position: absolute;
        top: 1rem;
        right: 1rem;
        --dark-mode-toggle-light-icon: url(https://googlechromelabs.github.io/dark-mode-toggle/demo/moon.png);
        --dark-mode-toggle-dark-icon: url(https://googlechromelabs.github.io/dark-mode-toggle/demo/sun.png);
      }
    </style>
  </head>
  <body>   
    <figure>
      <picture>
        <source srcset="https://googlechrome.github.io/samples/glitch-migration/darkmode/picture/assets/695100d4-5f7f-4ac4-b051-5a7cc71f3b3f_480px-Blue_Marble_Western_Hemisphere.jpg?v=1560946212255" media="(prefers-color-scheme: dark)">
        <source srcset="https://googlechrome.github.io/samples/glitch-migration/darkmode/picture/assets/695100d4-5f7f-4ac4-b051-5a7cc71f3b3f_480px-Blue_Marble_Eastern_Hemisphere.jpg?v=1560946212618" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
        <img width="480" height="480" src="https://googlechrome.github.io/samples/glitch-migration/darkmode/picture/assets/695100d4-5f7f-4ac4-b051-5a7cc71f3b3f_480px-Blue_Marble_Eastern_Hemisphere.jpg?v=1560946212618" >
      </picture>
      <figcaption>NASA Blue Marble: <a href="https://commons.wikimedia.org/wiki/File:Blue_Marble_Eastern_Hemisphere.jpg">Eastern Hemisphere</a>, <a href="https://commons.wikimedia.org/wiki/File:Blue_Marble_Western_Hemisphere.jpg">Western Hemisphere</a></figcaption>
    </figure>

    <dark-mode-toggle></dark-mode-toggle>

    <script>
      (() => {
        if (window.matchMedia('(prefers-color-scheme)').media === 'not all') {
          // alert('Your browser does not support the `prefers-color-scheme` media query.');
        }
        const picture = document.querySelector('picture');
        const dark = picture.querySelector('source[media="(prefers-color-scheme: dark)"]');
        const light = picture.querySelector('source[media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)"]');

        const modeChange = (mode) => {
          if (mode === 'dark') {
            dark.media = 'all';
            light.media = 'none';
          } else {
            dark.media = 'none';
            light.media = 'all';
          }
        }; 

        document.addEventListener('colorschemechange', (e) => {    
          modeChange(e.detail.colorScheme);
        });

        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');              
        darkModeMediaQuery.addListener((e) => {
          if (e.matches) {
            modeChange('dark');
          } else {
            modeChange('light');
          }
        });        
      })();
    </script>

    -->
  </body>
</html>
