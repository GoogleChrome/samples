<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Statue of Liberty keyring -->
  <!-- Keyring circle -->
  <circle cx="50" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="4"/>
  <!-- Connecting link -->
  <rect x="47" y="16" width="6" height="8" fill="currentColor"/>
  <!-- Crown with 7 spikes -->
  <path d="M36 34 L39 26 L42 34 L44 24 L47 34 L50 22 L53 34 L56 24 L59 34 L61 26 L64 34 Z" fill="currentColor"/>
  <!-- Crown base band -->
  <rect x="34" y="34" width="32" height="6" fill="currentColor"/>
  <!-- Face/head -->
  <rect x="36" y="40" width="28" height="16" rx="4" fill="currentColor"/>
  <!-- Robe / body -->
  <path d="M34 56 L30 90 L70 90 L66 56 Z" fill="currentColor"/>
  <!-- Tablet (book) -->
  <rect x="58" y="60" width="12" height="16" rx="2" fill="white" opacity="0.3"/>
  <!-- Raised torch arm -->
  <path d="M62 56 L68 40 L72 42 L68 58" fill="currentColor"/>
  <!-- Torch flame -->
  <ellipse cx="70" cy="37" rx="5" ry="8" fill="currentColor" opacity="0.9"/>
  <!-- Robe folds -->
  <line x1="42" y1="58" x2="38" y2="88" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="50" y1="58" x2="50" y2="88" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="58" y1="58" x2="62" y2="88" stroke="white" stroke-width="1.5" opacity="0.25"/>
</svg>
