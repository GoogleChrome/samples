<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Carnival / Masquerade mask with feathers -->
  <!-- Feathers fan (behind mask) -->
  <!-- Left feathers -->
  <ellipse cx="16" cy="30" rx="8" ry="22" fill="currentColor" opacity="0.6" transform="rotate(-30 16 30)"/>
  <ellipse cx="10" cy="42" rx="8" ry="22" fill="currentColor" opacity="0.5" transform="rotate(-50 10 42)"/>
  <ellipse cx="8" cy="56" rx="8" ry="20" fill="currentColor" opacity="0.45" transform="rotate(-70 8 56)"/>
  <!-- Right feathers -->
  <ellipse cx="84" cy="30" rx="8" ry="22" fill="currentColor" opacity="0.6" transform="rotate(30 84 30)"/>
  <ellipse cx="90" cy="42" rx="8" ry="22" fill="currentColor" opacity="0.5" transform="rotate(50 90 42)"/>
  <ellipse cx="92" cy="56" rx="8" ry="20" fill="currentColor" opacity="0.45" transform="rotate(70 92 56)"/>
  <!-- Top feathers -->
  <ellipse cx="50" cy="16" rx="8" ry="24" fill="currentColor" opacity="0.65"/>
  <ellipse cx="34" cy="14" rx="8" ry="22" fill="currentColor" opacity="0.6" transform="rotate(-15 34 14)"/>
  <ellipse cx="66" cy="14" rx="8" ry="22" fill="currentColor" opacity="0.6" transform="rotate(15 66 14)"/>
  <!-- Feather stems -->
  <line x1="50" y1="36" x2="50" y2="16" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Mask face -->
  <path d="M16 50 C16 38 28 32 50 32 C72 32 84 38 84 50 C84 62 72 70 50 70 C28 70 16 62 16 50 Z" fill="currentColor"/>
  <!-- Eye holes -->
  <ellipse cx="34" cy="50" rx="12" ry="9" fill="white" opacity="0.3"/>
  <ellipse cx="66" cy="50" rx="12" ry="9" fill="white" opacity="0.3"/>
  <!-- Eye hole dark centers -->
  <ellipse cx="34" cy="50" rx="8" ry="6" fill="currentColor" opacity="0.8"/>
  <ellipse cx="66" cy="50" rx="8" ry="6" fill="currentColor" opacity="0.8"/>
  <!-- Decorative swirls -->
  <path d="M22 52 C20 48 22 44 26 46" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M78 52 C80 48 78 44 74 46" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Nose suggestion -->
  <path d="M46 58 Q50 62 54 58" stroke="white" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Handle/stick -->
  <rect x="48" y="68" width="4" height="24" rx="2" fill="currentColor"/>
</svg>
