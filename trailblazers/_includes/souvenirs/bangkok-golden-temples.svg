<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Seated Buddha figurine -->
  <!-- Ushnisha (top knot) -->
  <ellipse cx="50" cy="13" rx="7" ry="8" fill="currentColor"/>
  <!-- Head -->
  <ellipse cx="50" cy="28" rx="13" ry="15" fill="currentColor"/>
  <!-- Neck -->
  <rect x="46" y="41" width="8" height="5" fill="currentColor"/>
  <!-- Body/robe -->
  <path d="M28 78 L36 50 C38 44 44 45 50 45 C56 45 62 44 64 50 L72 78 Z" fill="currentColor"/>
  <!-- Lotus seat base -->
  <path d="M22 82 Q35 76 50 78 Q65 76 78 82 L75 88 Q62 84 50 86 Q38 84 25 88 Z" fill="currentColor"/>
  <!-- Meditation hands (dhyana mudra) -->
  <ellipse cx="50" cy="72" rx="13" ry="5" fill="white" opacity="0.3"/>
  <!-- Urna dot on forehead -->
  <circle cx="50" cy="25" r="2" fill="white" opacity="0.5"/>
  <!-- Robe fold lines -->
  <path d="M38 52 L34 70" stroke="white" stroke-width="1" opacity="0.3"/>
  <path d="M62 52 L66 70" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>
