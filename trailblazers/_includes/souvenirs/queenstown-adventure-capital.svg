<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Kiwi bird (New Zealand) -->
  <!-- Round body -->
  <ellipse cx="52" cy="62" rx="30" ry="26" fill="currentColor"/>
  <!-- Head -->
  <circle cx="26" cy="50" r="16" fill="currentColor"/>
  <!-- Long bill -->
  <path d="M14 52 L-2 56 C-4 57 -4 59 -2 60 L14 58 Z" fill="currentColor"/>
  <!-- Actually let's use positive coords -->
  <path d="M16 52 C10 50 4 52 6 56 C4 60 10 60 16 56 Z" fill="currentColor"/>
  <!-- Eye -->
  <circle cx="20" cy="46" r="4" fill="white" opacity="0.8"/>
  <circle cx="20" cy="46" r="2" fill="currentColor"/>
  <!-- Wing texture (feather lines) -->
  <path d="M36 52 C40 44 48 42 56 46" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M34 60 C40 52 50 50 60 54" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M36 68 C42 62 52 60 62 64" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Fluffy feather texture on body -->
  <path d="M44 50 C46 44 52 44 54 50" stroke="white" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M56 50 C58 44 64 44 66 50" stroke="white" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Legs (short!) -->
  <path d="M40 86 L38 96" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <path d="M55 88 L54 96" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet (3 toes) -->
  <path d="M34 96 L38 96 L44 96" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 96 L54 96 L60 96" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>
