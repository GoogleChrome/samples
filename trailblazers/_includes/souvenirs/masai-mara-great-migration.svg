<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Wooden giraffe -->
  <!-- Long neck -->
  <rect x="44" y="10" width="14" height="42" rx="7" fill="currentColor"/>
  <!-- Head -->
  <ellipse cx="51" cy="14" rx="10" ry="9" fill="currentColor"/>
  <!-- Ossicones (horns) -->
  <rect x="46" y="5" width="4" height="8" rx="2" fill="currentColor"/>
  <rect x="54" y="5" width="4" height="8" rx="2" fill="currentColor"/>
  <!-- Ear -->
  <ellipse cx="38" cy="16" rx="5" ry="3" fill="currentColor" transform="rotate(-20 38 16)"/>
  <ellipse cx="64" cy="16" rx="5" ry="3" fill="currentColor" transform="rotate(20 64 16)"/>
  <!-- Eye -->
  <circle cx="45" cy="13" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="45" cy="13" r="1.2" fill="currentColor"/>
  <!-- Body -->
  <ellipse cx="50" cy="72" rx="24" ry="20" fill="currentColor"/>
  <!-- Giraffe spots on body -->
  <ellipse cx="42" cy="65" rx="5" ry="4" fill="white" opacity="0.2"/>
  <ellipse cx="56" cy="62" rx="4" ry="5" fill="white" opacity="0.2"/>
  <ellipse cx="46" cy="76" rx="5" ry="3.5" fill="white" opacity="0.2"/>
  <ellipse cx="60" cy="73" rx="4" ry="5" fill="white" opacity="0.2"/>
  <!-- Neck spots -->
  <ellipse cx="50" cy="35" rx="4" ry="3" fill="white" opacity="0.2"/>
  <ellipse cx="50" cy="48" rx="4" ry="3" fill="white" opacity="0.2"/>
  <!-- Legs -->
  <rect x="32" y="88" width="7" height="10" rx="3" fill="currentColor"/>
  <rect x="42" y="90" width="7" height="8" rx="3" fill="currentColor"/>
  <rect x="54" y="90" width="7" height="8" rx="3" fill="currentColor"/>
  <rect x="64" y="88" width="7" height="10" rx="3" fill="currentColor"/>
  <!-- Tail -->
  <path d="M74 74 C78 78 78 84 76 88" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
