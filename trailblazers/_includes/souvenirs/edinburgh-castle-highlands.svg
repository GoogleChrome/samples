<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Scottish whisky miniature bottle -->
  <!-- Cork/stopper -->
  <ellipse cx="50" cy="10" rx="7" ry="5" fill="currentColor"/>
  <!-- Neck -->
  <rect x="45" y="13" width="10" height="14" rx="2" fill="currentColor"/>
  <!-- Shoulder -->
  <path d="M40 27 C38 30 36 34 36 38 L64 38 C64 34 62 30 60 27 Z" fill="currentColor"/>
  <!-- Body - square bottle shape -->
  <rect x="34" y="38" width="32" height="44" rx="2" fill="currentColor"/>
  <!-- Label area -->
  <rect x="37" y="44" width="26" height="28" rx="2" fill="white" opacity="0.2"/>
  <!-- Tartan lines on label -->
  <line x1="42" y1="44" x2="42" y2="72" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="50" y1="44" x2="50" y2="72" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="58" y1="44" x2="58" y2="72" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="37" y1="52" x2="63" y2="52" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="37" y1="60" x2="63" y2="60" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="37" y1="68" x2="63" y2="68" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Bottle base -->
  <rect x="32" y="80" width="36" height="6" rx="2" fill="currentColor" opacity="0.75"/>
</svg>
