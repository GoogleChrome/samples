<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Nazar (evil eye) amulet -->
  <!-- Outer white ring -->
  <circle cx="50" cy="48" r="36" fill="currentColor"/>
  <circle cx="50" cy="48" r="30" fill="white" opacity="0.9"/>
  <!-- Middle blue ring -->
  <circle cx="50" cy="48" r="22" fill="currentColor"/>
  <!-- Inner white ring -->
  <circle cx="50" cy="48" r="15" fill="white" opacity="0.85"/>
  <!-- Pupil -->
  <circle cx="50" cy="48" r="8" fill="currentColor"/>
  <!-- Eye shine highlights -->
  <circle cx="54" cy="44" r="3" fill="white" opacity="0.6"/>
  <circle cx="56" cy="46" r="1.5" fill="white" opacity="0.4"/>
  <!-- Cord/hanging loop at top -->
  <path d="M50 12 C50 12 55 8 55 4 C55 2 53 1 50 2 C47 1 45 2 45 4 C45 8 50 12 50 12 Z" fill="currentColor"/>
</svg>
